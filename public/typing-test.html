<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing game (test page) - Underflow Hackit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/shared/base.css" />
  <link rel="stylesheet" href="css/island/style.css" />
  <link rel="stylesheet" href="css/typing/typing.css" />
  <style>
    .test-page { padding: 24px 20px; }
    .test-page h1 { margin: 0 0 6px; font-size: 24px; }
    .test-page p { color: var(--muted); font-weight: 600; line-height: 1.4; }
    .test-page .btn { margin-top: 10px; }
    #log { margin-top: 18px; padding: 12px; border-radius: 12px; background: var(--white); border: 1px solid var(--line); font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; min-height: 60px; }
  </style>
</head>
<body>
  <!-- Test page for the Typing mini-game ONLY. No login, no island, no Supabase.
       The island pieces the game talks to (pop-up sheet, rewards) are faked below, so you
       can play the feature in isolation. On the real island it plugs into ui.js + economy.js. -->
  <div class="app">
    <div class="test-page">
      <h1>Typing game</h1>
      <p>Test page. Pick a level. Rewards are only printed below, nothing is saved.</p>
      <div id="level-buttons"></div>
      <div id="log" role="log" aria-live="polite">Waiting for a round...</div>
    </div>
    <div class="overlay" id="overlay" hidden><div class="sheet" id="sheet"></div></div>
  </div>

  <script src="js/journey/levels.js"></script>
  <script src="js/island/islandData.js"></script>
  <script src="js/storeVocab/scan/pronunciation.js"></script>
  <script>
    // ---- fakes for the island pieces typing.js talks to ----
    const IslandUI = {
      onClose: null, locked: false,
      esc: (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])),
      openSheet(html, onClose, locked) {
        this.locked = !!locked; this.onClose = onClose || null;
        document.getElementById("sheet").innerHTML = html;
        document.getElementById("overlay").hidden = false;
      },
      close(force) {
        if (this.locked && !force) return;
        document.getElementById("overlay").hidden = true;
        document.getElementById("sheet").innerHTML = "";
      },
    };
    const IslandHooks = { startMiniGame() { return false; } };
    const IslandEconomy = { miniPayout: (level, ratio) => ({ coins: Math.round(40 * (0.4 + 0.6 * ratio)), xp: Math.round(40 * (0.4 + 0.6 * ratio)) }) };
    const logEl = document.getElementById("log");
    window.IslandAPI = {
      completeLevel: async (level, ratio) => { logEl.textContent = `completeLevel(${level}, ${ratio.toFixed(2)})`; },
      recordPractice: async (words) => { logEl.textContent += `\nrecordPractice(${JSON.stringify(words)})`; },
    };
  </script>
  <script src="js/typing/config.js"></script>
  <script src="js/typing/typingData.js"></script>
  <script src="js/typing/typing.js"></script>
  <script>
    // Build a button for every level whose slot is the Typing mini-game, so the list
    // follows config.js and the level layout instead of being hard-coded.
    const buttons = document.getElementById("level-buttons");
    ISLAND_LEVELS
      .filter((l) => getMiniGameForLevel(l.level).id === TYPING_CONFIG.miniGameId)
      .forEach((l) => {
        const btn = document.createElement("button");
        btn.className = "btn btn-primary btn-block";
        btn.type = "button";
        btn.textContent = `Level ${l.level}: ${l.name}`;
        btn.addEventListener("click", () => { logEl.textContent = "Playing..."; IslandHooks.startMiniGame(l); });
        buttons.appendChild(btn);
      });
  </script>
</body>
</html>
