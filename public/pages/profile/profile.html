<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Mother Tongue" />
  <title>Profile - Underflow Hackit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@500;700&family=Noto+Sans+Tamil:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/shared/base.css" />
  <link rel="stylesheet" href="../../css/shared/topbar.css" />
  <link rel="stylesheet" href="../../css/shared/bottomnav.css" />
  <link rel="stylesheet" href="../../css/profile/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
</head>
<body>
  <div class="app">
    <div id="app-section" hidden>

      <!-- Profile -->
      <section id="profile-view" class="pf-screen" hidden>
        <header class="top-bar has-back">
          <a id="pf-back" class="icon-btn" href="../island/island.html" aria-label="Back to Island"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></a>
          <h1 class="top-title">Profile</h1>
        </header>

        <div id="status-message" class="status-message" role="status" aria-live="polite"></div>

        <div class="pf-hero">
          <button type="button" id="pf-avatar-btn" class="pf-avatar" aria-label="Change your picture">
            <span id="pf-avatar"></span>
            <span class="pf-avatar-edit" id="pf-edit-icon" aria-hidden="true"></span>
          </button>
          <h2 id="pf-name" class="pf-name"></h2>
          <button type="button" id="pf-change-pic" class="pf-link">Change picture</button>
        </div>

        <div id="pf-stats" class="pf-stats"></div>

        <section class="pf-section">
          <div class="pf-section-head">
            <h2>Badges</h2>
            <span id="pf-badge-count" class="pf-meta"></span>
          </div>
          <div id="pf-badges" class="pf-badges"></div>
        </section>

        <section class="pf-section">
          <div class="pf-section-head">
            <h2>Favourite cards</h2>
            <button type="button" id="pf-edit-favs" class="pf-link">Edit</button>
          </div>
          <div id="pf-favs" class="pf-favs"></div>
        </section>

        <div class="pf-footer">
          <button type="button" id="pf-signout" class="btn btn-outline btn-block">Sign out</button>
        </div>
      </section>

      <!-- Choose a picture -->
      <section id="avatar-view" class="pf-screen" hidden>
        <header class="top-bar has-back">
          <button type="button" id="avatar-back" class="icon-btn" aria-label="Back to profile"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
          <h1 class="top-title">Choose a picture</h1>
        </header>
        <div class="av-preview" id="av-preview"></div>
        <div id="av-grid" class="av-grid" role="radiogroup" aria-label="Profile picture"></div>
        <div class="pf-footer">
          <button type="button" id="avatar-done" class="btn btn-primary btn-block">Done</button>
        </div>
      </section>

      <!-- Choose favourite cards -->
      <section id="favs-view" class="pf-screen" hidden>
        <header class="top-bar has-back">
          <button type="button" id="favs-back" class="icon-btn" aria-label="Back to profile"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
          <h1 class="top-title">Favourite cards</h1>
        </header>
        <p class="pf-lead">Pick up to 3 cards to show off on your profile.</p>
        <div id="favs-chosen" class="fv-chosen"></div>
        <div class="pf-search">
          <label class="visually-hidden" for="favs-search">Search cards</label>
          <input id="favs-search" class="field" type="search" placeholder="Search words, pinyin or meanings" autocomplete="off" />
        </div>
        <div id="favs-grid" class="fv-grid"></div>
        <div class="pf-footer pf-footer-sticky">
          <button type="button" id="favs-save" class="btn btn-primary btn-block">Save</button>
        </div>
      </section>

      <nav id="bottom-nav" class="bottom-nav" aria-label="Main" data-active="">
        <a class="nav-tab" data-nav="journey" href="../island/island.html"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5" /></svg><span>Island</span></a>
        <a class="nav-tab" data-nav="friends" href="../friends/friends.html"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-4 4v-4H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" /></svg><span>Scenarios</span></button>
        <div class="nav-capture"><a class="nav-capture-btn" data-nav="capture" href="../storeVocab/storeVocab.html#capture" aria-label="Capture words"><svg class="icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z" /><circle cx="12" cy="13" r="3.5" /></svg></a><span class="nav-capture-label">Capture</span></div>
        <a class="nav-tab" data-nav="collection" href="../storeVocab/storeVocab.html#collection"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="6" width="12" height="15" rx="2" /><path d="M8 3h11a1 1 0 0 1 1 1v14" /></svg><span>Collection</span></a>
        <button class="nav-tab" type="button" disabled title="Coming soon"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5" /><circle cx="17.5" cy="9" r="2.5" /><path d="M17 14.5c2.6 0 4.2 1.4 4.8 4.5" /></svg><span>Friends</span></a>
      </nav>
    </div>
  </div>

  <script src="../../js/shared/supabaseClient.js"></script>
  <script src="../../js/shared/icons.js"></script>
  <script src="../../js/shared/avatars.js"></script>
  <script src="../../js/shared/bottomNav.js"></script>
  <script src="../../js/cards/data/zhFrequency.js"></script>
  <script src="../../js/cards/data/msFrequency.js"></script>
  <script src="../../js/cards/data/taFrequency.js"></script>
  <script src="../../js/cards/rarity.js"></script>
  <script src="../../js/shared/auth.js"></script>
  <script src="../../js/cards/vocabulary.js"></script>
  <script src="../../js/cards/cardArt.js"></script>
  <script src="../../js/cards/decor.js"></script>
  <script src="../../js/cards/cards.js"></script>
  <script src="../../js/cards/data/zoneWords.js"></script>
  <script src="../../js/cards/albumCards.js"></script>
  <script src="../../js/shared/roleCards.js"></script>
  <script src="../../js/cards/albums.js"></script>
  <script src="../../js/shared/streak.js"></script>
  <script src="../../js/shared/profile.js"></script>
  <script src="../../js/shared/rewards.js"></script>
  <script src="../../js/cards/quests.js"></script>
  <script src="../../js/shared/appContent.js"></script>
  <script src="../../js/profile/script.js"></script>
</body>
</html>
