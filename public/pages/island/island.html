<head>

  <link rel="manifest" href="../../manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Mother Tongue" />
  <title>Island - Underflow Hackit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@500;700;800&family=Noto+Sans+Tamil:wght@500;700&display=swap" rel="stylesheet" />

</head>
<body data-page="island">
  <div class="app">

<section id="language-select-section" class="language-screen" hidden>
      <div class="scene scene-language">
        <div id="language-hero-art" class="scene-art"></div>
      </div>
      <div class="language-body">
        <h1 class="language-title">Which Mother Tongue do you want to practise?</h1>
        <p class="language-hint">You can switch any time from the top of your journey.</p>
        <div class="language-grid">
          <button type="button" class="language-choice" data-lang="zh">
            <span class="language-text">
              <span class="language-native" lang="zh-Hans">中文</span>
              <span class="language-english">Chinese · Mandarin</span>
            </span>
            <span class="language-arrow" aria-hidden="true"></span>
          </button>
          <button type="button" class="language-choice" data-lang="ms">
            <span class="language-text">
              <span class="language-native" lang="ms">Bahasa Melayu</span>
              <span class="language-english">Malay</span>
            </span>
            <span class="language-arrow" aria-hidden="true"></span>
          </button>
          <button type="button" class="language-choice" data-lang="ta">
            <span class="language-text">
              <span class="language-native" lang="ta">தமிழ்</span>
              <span class="language-english">Tamil</span>
            </span>
            <span class="language-arrow" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </section>

        <section id="journey-section" class="island-screen" hidden>
      <header class="top-bar journey-bar">
        <div class="stats">
          <button type="button" id="change-language" class="stat-chip" aria-label="Switch Mother Tongue"></button>
          <div id="streak-chip" class="stat-chip stat-streak" role="img" hidden></div>
          <button type="button" id="level-chip" class="stat-chip stat-level" hidden></button>
          <div id="island-coins" class="stat-chip stat-coins" role="img" aria-label="Coins" hidden></div>
        </div>
        <button type="button" id="open-profile" class="avatar-btn" aria-label="Your profile and picture"></button>
      </header>
      <div id="journey-quests" class="quests-panel" aria-label="Daily quests" hidden></div>
      <!-- The island is mounted here by js/island/app.js -->
      <div id="map" class="island-wrap"></div>
    </section>

    <div id="status-message" class="status-message toast" role="status" aria-live="polite"></div>

    <nav id="bottom-nav" data-active="journey" hidden></nav>
  </div>

  <!-- shared -->
  <script src="../../js/shared/supabaseClient.js"></script>
  <script src="../../js/shared/icons.js"></script>

  <script src="../../js/shared/rewards.js"></script>
  <script src="../../js/shared/profile.js"></script>
  <script src="../../js/cards/quests.js"></script>

  <script src="../../js/cards/data/zhFrequency.js"></script>
  <script src="../../js/cards/data/msFrequency.js"></script>
  <script src="../../js/cards/data/taFrequency.js"></script>
  <script src="../../js/cards/rarity.js"></script>
  <script src="../../js/storeVocab/scan/pronunciation.js"></script>
  <script src="../../js/cards/vocabulary.js"></script>
  <script src="../../js/cards/cardArt.js"></script>
  <script src="../../js/cards/decor.js"></script>
  <script src="../../js/cards/cards.js"></script>
  <script src="../../js/cards/data/zoneWords.js"></script>
  <script src="../../js/cards/albumCards.js"></script>
  <script src="../../js/shared/roleCards.js"></script>
  <script src="../../js/cards/albums.js"></script>
  <script src="../../js/storeVocab/packOpening.js"></script>
  <script src="../../js/journey/levels.js"></script>
  <!-- the island -->
  <script src="../../js/island/authScenes.js"></script>
  <script src="../../js/island/islandData.js"></script>
  <script src="../../js/island/homeData.js"></script>
  <script src="../../js/island/lang.js"></script>
  <script src="../../js/island/save.js"></script>
  <script src="../../js/island/state.js"></script>
  <script src="../../js/island/art.js"></script>
