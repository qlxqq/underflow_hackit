<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Composition Practice</title>

    <!-- PWA -->
    <link rel="manifest" href="../../manifest.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">

    <!-- Shared tokens first, then this page -->
    <link rel="stylesheet" href="../../css/shared/base.css">
    <link rel="stylesheet" href="../../css/shared/topbar.css">
    <link rel="stylesheet" href="../../css/composition/composition.css">
</head>

<body>
    <div class="app composition-page pr-page">

        <header class="top-bar has-back pr-top">
            <a href="../../pages/island/island.html" class="icon-btn back-button" aria-label="Back to the island">
                <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            </a>

            <!-- one segment per question (filled in by composition.js) -->
            <div class="pr-progress" id="progress" aria-hidden="true"></div>

            <span class="chip pr-lang" id="langBadge" aria-label="Practising in">中文</span>
        </header>

        <main class="composition-container pr-main">

            <div class="pr-zone-row">
                <span class="pr-zone-pill" id="zonePill">ZONE 1&nbsp;&nbsp;NEIGHBOURHOOD</span>
                <span class="pr-level" id="questionCounter">Loading questions...</span>
            </div>

            <section class="question-card pr-card">
                <p class="subtitle pr-prompt">
                    Arrange the words to form a correct Chinese sentence.
                </p>

                <h2 id="questionPrompt">Loading question...</h2>

                <p class="question-hint" id="questionHint">
                    Select the words in the correct order.
                </p>
            </section>

            <section class="answer-section">
                <div class="section-heading">
                    <h3>Your sentence</h3>
                    <span class="small-label">Tap a word to remove it</span>
                </div>

                <div
                    class="answer-area"
                    id="answerArea"
                    aria-label="Your constructed sentence"
                    aria-live="polite"
                >
                    <span class="empty-placeholder" id="emptyPlaceholder">
                        Select words from the word bank below...
                    </span>
                </div>
            </section>

            <section class="word-bank-section">
                <div class="section-heading">
                    <h3>Word bank</h3>
                    <span class="small-label">Choose the correct order</span>
                </div>

                <div class="word-bank" id="wordBank">
                    <!-- JavaScript generates word tiles here -->
                </div>
            </section>

            <section
                class="feedback-box"
                id="feedbackBox"
                role="status"
                aria-live="polite"
                hidden
            >
                <span class="feedback-icon" id="feedbackIcon">✓</span>

                <div>
                    <h3 id="feedbackTitle">Good job!</h3>
                    <p id="feedbackMessage"></p>
                </div>
            </section>

            <div class="action-buttons pr-actions">
                <button type="button" class="btn btn-outline reset-button" id="resetButton" disabled>
                    Reset
                </button>

                <button type="button" class="btn btn-primary check-button" id="checkButton" disabled>
                    Check answer
                </button>

                <button type="button" class="btn btn-primary next-button" id="nextButton" hidden>
                    Next question →
                </button>
            </div>

        </main>

    </div>

    <!-- Supabase library (same pinned version as island.html), then the shared client, each loaded once -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
    <script src="../../js/shared/supabaseClient.js"></script>

    <!-- Shared app code: sign-in (getCurrentUser), then the streak and rewards helpers -->
    <script src="../../js/shared/auth.js"></script>
    <script src="../../js/shared/streak.js"></script>
    <script src="../../js/shared/rewards.js"></script>

    <!-- Composition feature -->
    <script src="../../js/composition/composition.js"></script>
</body>
</html>
