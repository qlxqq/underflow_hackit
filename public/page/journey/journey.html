<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journey - Underflow Hackit</title>
  <link rel="stylesheet" href="../../css/journey/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
</head>
<body>
  <h1>Your Journey</h1>

  <section id="auth-section">
    <div id="auth-status" class="status-message"></div>

    <h2>Sign up</h2>
    <form id="signup-form">
      <input type="email" id="signup-email" placeholder="Email" required />
      <input type="password" id="signup-password" placeholder="Password" required minlength="6" />
      <input type="text" id="signup-username" placeholder="Username" required />
      <button type="submit">Sign up</button>
    </form>

    <h2>Log in</h2>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Log in</button>
    </form>
  </section>

  <!-- Shown right after login, before any levels - choosing a Mother
       Tongue is a deliberate first step, not a silent default. -->
  <section id="language-select-section" hidden>
    <h2>Which Mother Tongue do you want to practice?</h2>
    <button class="language-choice" data-lang="zh">Chinese</button>
    <button class="language-choice" data-lang="ms">Malay</button>
    <button class="language-choice" data-lang="ta">Tamil</button>
  </section>

  <section id="journey-section" hidden>
    <button id="sign-out">Sign out</button>
    <button id="change-language">Switch Mother Tongue</button>

    <div id="levels-container"></div>
  </section>

  <!-- NOTE: these point at a placeholder Supabase config for now. Once this
       branch merges with store-vocabulary, point this at the same
       supabaseClient.js the capture feature already uses, instead of a
       duplicate file, so there's only one source of truth for the connection. -->
  <script src="../../js/journey/supabaseClientPlaceholder.js"></script>
  <script src="../../js/journey/zhFrequencyPlaceholder.js"></script>
  <script src="../../js/journey/msFrequencyPlaceholder.js"></script>
  <script src="../../js/journey/taFrequencyPlaceholder.js"></script>
  <script src="../../js/journey/levels.js"></script>
  <script src="../../js/journey/auth.js"></script>
  <script src="../../js/journey/progress.js"></script>
  <script src="../../js/journey/script.js"></script>
</body>
</html>
